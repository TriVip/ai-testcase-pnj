server {
    # 8080 rather than 80: the image runs as a non-root user, which cannot bind
    # a port below 1024. docker-compose publishes this as 8080 on the host.
    listen 8080;
    server_name localhost;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # index.html references the current build's hashed asset filenames,
        # so it must always be revalidated — without this, browsers apply
        # heuristic caching to it (no explicit Cache-Control was set at all),
        # which can pin a visitor to a build from before their last visit
        # indefinitely, silently hiding every subsequent deploy from them.
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed filenames (index-<hash>.js) change on every build with
    # different content, so it's safe — and desirable — to cache these
    # forever. A new deploy is a new filename, never a same-name change.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy Socket.io
    location /socket.io/ {
        proxy_pass http://backend:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
