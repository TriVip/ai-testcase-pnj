<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-thin-rounded/css/uicons-thin-rounded.css'>
  <title>AI Test Case Generator</title>
  <script>
    // Apply the saved theme before React renders, so loading skeletons don't
    // flash light in dark mode. Same rule as Sidebar.jsx / Login.jsx.
    try {
      var t = localStorage.getItem('theme');
      if (t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
