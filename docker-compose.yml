services:

  backend:
    build:
      context: ./backend
    ports:
      - "9999:${PORT:-9999}"
    environment:
      - PORT=${PORT:-9999}
      - MONGODB_URI=${MONGODB_URI}
      # No default on purpose. This value is the allowed CORS origin and the
      # Socket.io origin, so a stale one is not a cosmetic problem: it used to
      # default to a specific domain, and once that registration lapsed the
      # fallback pointed at a name anyone could claim — which would hand that
      # origin CORS approval with credentials: true, on a SameSite=None cookie.
      # `:?` makes compose refuse to start when it is unset, rather than
      # silently trusting somebody else's domain.
      - FRONTEND_URL=${FRONTEND_URL:?set FRONTEND_URL to the origin serving the frontend}
      - NODE_ENV=${NODE_ENV:-development}
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    # nginx resolves proxy_pass upstreams when it loads its config and exits if
    # the name does not resolve, so it must not start before the backend
    # container exists on the network. Without this the frontend loses the race
    # on a cold `up` and dies with "host not found in upstream".
    depends_on:
      - backend
    # The container listens on 8080, not 80 — nginx runs unprivileged there and
    # cannot bind a port below 1024. The published port is unchanged.
    ports:
      - "8080:8080"

volumes:
  mongodb_data:
